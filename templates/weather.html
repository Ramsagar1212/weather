<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>
    <!-- Bootstrap for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #83a4d4, #b6fbff);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
            padding: 30px;
            background: #fff;
            width: 400px;
        }
        .weather-icon {
            width: 100px;
        }
        .error {
            color: #ff4d4d;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 class="mb-4">🌤 Weather App</h2>
        <form method="get" class="d-flex mb-3">
            <input type="text" name="city" class="form-control me-2" placeholder="Enter city" required>
            <button type="submit" class="btn btn-primary">Search</button>
        </form>

        {% if weather %}
            <h3>{{ weather.city }}</h3>
            <img src="http://openweathermap.org/img/wn/{{ weather.icon }}@2x.png" alt="Weather Icon" class="weather-icon">
            <h4 class="mt-3">{{ weather.temperature }}°C</h4>
            <p class="text-muted">{{ weather.description|title }}</p>
        {% elif error %}
            <p class="error">{{ error }}</p>
        {% else %}
            <p class="text-muted">Type a city name to see the weather 🌍</p>
        {% endif %}
    </div>
</body>
</html>
